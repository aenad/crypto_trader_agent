services:
  dashboard-api:
    build:
      context: .
      dockerfile: Dockerfile.dashboard-api
    environment:
      QUANTPILOT_DASHBOARD_ROOT: /reports
      PYTHONDONTWRITEBYTECODE: "1"
    volumes: ["./data/dashboard:/reports:ro"]
    networks: [dashboard]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/dashboard/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
  dashboard-web:
    build:
      context: .
      dockerfile: Dockerfile.dashboard-web
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      dashboard-api:
        condition: service_healthy
    networks: [dashboard]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  postgres:
    image: postgres:16-alpine
    profiles: [marketdata]
    environment:
      POSTGRES_USER: quantpilot
      POSTGRES_PASSWORD: ${QUANTPILOT_DB_PASSWORD:-local-development-only}
      POSTGRES_DB: quantpilot
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["marketdata-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantpilot -d quantpilot"]
      interval: 5s
      timeout: 3s
      retries: 10
  marketdata:
    profiles: [marketdata]
    build:
      context: .
      dockerfile: Dockerfile.marketdata
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      QUANTPILOT_POSTGRES_DSN: postgresql://quantpilot:${QUANTPILOT_DB_PASSWORD:-local-development-only}@postgres:5432/quantpilot
    volumes: ["marketdata-files:/app/data"]
    command: ["collect", "--source", "mcp", "--whitelist", "config/markets.example.json"]
  offline-demo:
    profiles: [tools]
    build: .
    network_mode: none
    read_only: true
    environment:
      QUANTPILOT_MODE: SHADOW
      QUANTPILOT_LIVE_EXECUTION_ENABLED: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  marketdata-postgres:
  marketdata-files:
networks:
  dashboard:
    internal: true

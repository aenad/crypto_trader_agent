[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wallex-quantpilot"
version = "0.1.0"
description = "Deterministic trading core contracts and offline orchestration"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6,<3", "tzdata>=2025.1"]

[project.optional-dependencies]
dashboard = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<3"]
marketdata = ["httpx>=0.27,<1", "mcp>=1.9,<2", "websockets>=14,<17", "jsonschema>=4.23,<5", "pyarrow>=18,<25", "psycopg[binary]>=3.2,<4"]
ai = ["lightgbm>=4.6,<5", "numpy>=2,<3"]

[project.scripts]
quantpilot-demo = "quantpilot.demo:main"
quantpilot-data = "quantpilot.marketdata.cli:main"
quantpilot-research = "quantpilot.trading.demo:main"
quantpilot-backtest = "quantpilot.backtest.cli:main"
quantpilot-ai = "quantpilot.ai.cli:main"
quantpilot-shadow = "quantpilot.shadow.cli:main"
quantpilot-live = "quantpilot.live.cli:main"
quantpilot-report = "quantpilot.dashboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["quantpilot*"]

[tool.setuptools.package-data]
"quantpilot.marketdata" = ["excluded.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/quantpilot/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src/quantpilot"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "jsonschema", "jsonschema.*", "lightgbm", "lightgbm.*"]
ignore_missing_imports = true

